# Ogni ora controlla i canali del gruppo e i risultati inseriti dal pannello admin:
# se c'è qualcosa di nuovo rigenera i dati del sito e li pubblica.
name: Aggiorna golfatine

on:
  schedule:
    - cron: "15 6-23 * * *" # ogni ora dalle 7 alle 24 (ora italiana)
  workflow_dispatch: # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiorna-golfatine
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Cerca nuovi video
        id: check
        run: python3 scripts/check_new_videos.py
      - name: Rigenera i dati del sito (foglio + risultati dal pannello admin)
        run: python3 scripts/build_data.py
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/golfatine.xlsx docs/data.js
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git config user.name "golfatine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dati aggiornati in automatico"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
